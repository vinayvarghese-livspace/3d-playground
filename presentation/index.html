<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Board · 3D Playground</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../images/3d-view_32px.png">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="board">
    <header class="master-bar">
      <h1 class="master-title" id="masterTitle">Loading…</h1>
      <div class="view-toggle" id="viewToggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="classic" title="Classic grid" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/>
            <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/>
            <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/>
            <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/>
          </svg>
          <span>Classic</span>
        </button>
        <button type="button" class="view-btn" data-view="pdp" title="3D / PDP view" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 2.5L3.5 7v10L12 21.5 20.5 17V7L12 2.5zm0 2.2l6.2 3.3L12 11.3 5.8 8 12 4.7zM5.5 9.7l5.5 2.9v6.6l-5.5-2.9V9.7zm7.5 9.5v-6.6l5.5-2.9v6.6L13 19.2z"/>
          </svg>
          <span>3D</span>
        </button>
      </div>
    </header>

    <div class="board-body">
      <section class="gallery" aria-label="Images">
        <!-- Classic: grid. 3D/PDP: thumbs + hero -->
        <div class="image-grid" id="imageGrid"></div>
        <div class="pdp-layout" id="pdpLayout" hidden>
          <div class="pdp-thumbs" id="pdpThumbs"></div>
          <div class="pdp-hero" id="pdpHero"></div>
        </div>
      </section>

      <aside class="sequence-panel" aria-label="Sequence">
        <h2 class="sequence-heading">Sequence</h2>
        <ol class="sequence-list" id="sequenceList"></ol>
      </aside>
    </div>
  </div>

  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
