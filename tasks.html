<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Playground (BETA V1.2)</title>
  <script>
    // Canonical app URL is index.html with hashes (#renamer | #available | #my).
    (function () {
      var h = (location.hash || '#available');
      if (!/^#(renamer|available|my)\b/i.test(h)) h = '#available';
      location.replace('index.html' + h);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="index.html#available">index.html</a>…</p>
</body>
</html>
